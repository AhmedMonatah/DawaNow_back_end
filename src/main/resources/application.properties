dawanow.ai.chat.max-symptom-products=${AI_CHAT_MAX_SYMPTOM_PRODUCTS:2}
dawanow.ai.chat.history-window=${AI_CHAT_HISTORY_WINDOW:10}
dawanow.ai.chat.max-tokens=${AI_CHAT_MAX_TOKENS:1400}
dawanow.ai.chat.retrieval-top-k=${AI_CHAT_RETRIEVAL_TOP_K:8}
dawanow.ai.chat.connect-timeout=${AI_CHAT_CONNECT_TIMEOUT:30s}
dawanow.ai.chat.max-attempts=${AI_CHAT_MAX_ATTEMPTS:3}
dawanow.ai.chat.retry-delay=${AI_CHAT_RETRY_DELAY:2s}
dawanow.ai.chat.add-to-cart-min-score=${AI_CHAT_ADD_TO_CART_MIN_SCORE:0.80}
dawanow.ai.chat.add-to-cart-min-gap=${AI_CHAT_ADD_TO_CART_MIN_GAP:0.10}
dawanow.ai.chat.max-cart-candidates=${AI_CHAT_MAX_CART_CANDIDATES:3}
dawanow.ai.chat.dashboard-summary-ttl=${AI_DASHBOARD_SUMMARY_TTL:10m}
dawanow.stripe.secret-key=${STRIPE_SECRET_KEY:}
dawanow.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
dawanow.stripe.currency=${STRIPE_CURRENCY:egp}
