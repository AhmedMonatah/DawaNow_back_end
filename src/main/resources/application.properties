spring.application.name=dawa-now

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/dawanow}
spring.datasource.username=${DB_USERNAME:dawanow}
spring.datasource.password=${DB_PASSWORD:dawanow}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

dawanow.data.seed.enabled=${SEED_ENABLED:false}
dawanow.data.products.import-enabled=${PRODUCT_IMPORT_ENABLED:true}
dawanow.ai.prescription.provider=${PRESCRIPTION_AI_PROVIDER:iti}
dawanow.ai.prescription.iti.endpoint-url=${ITI_AI_ENDPOINT_URL:http://apiaccess.iti.net.eg/api/v1/student/multimodal-chat}
dawanow.ai.prescription.iti.model=${ITI_AI_MODEL:qwen.qwen3-vl-235b-a22b}
dawanow.ai.prescription.iti.api-key=${SBG_API_KEY:}
dawanow.ai.prescription.iti.connect-timeout=${ITI_AI_CONNECT_TIMEOUT:5s}
dawanow.ai.prescription.iti.read-timeout=${ITI_AI_READ_TIMEOUT:60s}

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info

# JWT Configuration
#randomly generated 512-bit hex key
jwt.secret=${JWT_SECRET:5f4d80a13e52f50a32d1f9b3e6a4c28c89d2b71f50a9e2d3c4b5a6f7e8d9c0b1a2f3e4d5c6b7a8f9e0d1c2b3a4f5e6d7c8b9a0f1e2d3c4b5a6f7e8d9c0b1a2f3}

# 24 hours in milliseconds
jwt.expiration=900000

jwt.refresh-expiration=604800000

# Timeout for searching pharmacists in minutes
dawanow.request.search-timeout-minutes=15

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

dawanow.upload.license-dir=${LICENSE_UPLOAD_DIR:uploads}

# ----------------------------------------
# Mail Server Configuration
# ----------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:sarahsameh7@gmail.com}
spring.mail.password=${MAIL_PASSWORD:najmxjamluofumeg}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Resend API Configuration
resend.api.key=${RESEND_API_KEY:}

app.upload.dir=uploads
app.upload.max-size-mb=15

spring.profiles.active=seed
# Cohere embeddings (free trial) plus Student Bedrock Gateway chat.
dawanow.ai.provider=student-bedrock-gateway
dawanow.ai.base-url=${SBG_BASE_URL:http://apiaccess.iti.net.eg/api/v1}
dawanow.ai.api-key=${SBG_API_KEY:}
dawanow.ai.embedding-provider=${AI_EMBEDDING_PROVIDER:cohere}
dawanow.ai.embedding-base-url=${AI_EMBEDDING_BASE_URL:https://api.cohere.com/v2}
dawanow.ai.embedding-model=${AI_EMBEDDING_MODEL:embed-multilingual-v3.0}
dawanow.ai.embedding-api-key=${COHERE_API_KEY:}
dawanow.ai.generation-model=${SBG_CHAT_MODEL:openai.gpt-oss-20b-1:0}
dawanow.ai.generation-max-tokens=${SBG_CHAT_MAX_TOKENS:400}
dawanow.ai.request-timeout=${SBG_REQUEST_TIMEOUT:2m}

dawanow.ai.retrieval.initialize-on-startup=${AI_RETRIEVAL_INITIALIZE_ON_STARTUP:true}
dawanow.ai.retrieval.embedding-batch-size=${SBG_EMBEDDING_BATCH_SIZE:32}
dawanow.ai.retrieval.default-top-k=${AI_RETRIEVAL_TOP_K:8}
dawanow.ai.retrieval.max-top-k=${AI_RETRIEVAL_MAX_TOP_K:20}
dawanow.ai.retrieval.semantic-weight=${AI_RETRIEVAL_SEMANTIC_WEIGHT:0.70}
dawanow.ai.retrieval.minimum-score=${AI_RETRIEVAL_MINIMUM_SCORE:0.20}
